<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Productivity กลุ่มงานวิสัญญี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: navy header band with period controls -> tab strip -> one working view at a time (summary first, detail tables below) */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#EBEFF5; --ink:#132033; --muted:#5B6B80; --line:#D9E0EA;
  --accent:#103A63; --accent-2:#0B6E7F; --accent-ink:#FFFFFF; --accent-soft:#E1EBF6;
  --intime:#103A63; --f3:#21A05A; --f4:#2B6FE0; --f5:#EC6F23; --f6:#D99A00; --out:#8A4FD6; --tot:#132033;
  --hero-a:#0E3358; --hero-b:#0A6377;
  --good:#23814F; --good-bg:#E1F2E8; --warn:#B26A00; --warn-bg:#FBEFD9; --bad:#B8362A; --bad-bg:#F8E1DE; --wait:#5B6B80; --wait-bg:#E9EDF2;
  --band:rgba(35,129,79,.10);
  --font-ui:"IBM Plex Sans Thai",system-ui,"Leelawadee UI","Tahoma",sans-serif;
  --font-head:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141C; --surface:#151E29; --sunk:#1B2633; --ink:#E5ECF4; --muted:#93A3B7; --line:#283545;
  --accent:#123B60; --accent-2:#0E6A7A; --accent-ink:#EAF2FB; --accent-soft:#1C2F45;
  --intime:#8DB8E6; --f3:#4FD18A; --f4:#6EA2FF; --f5:#FF9A55; --f6:#F5C33B; --out:#B78BFF; --tot:#E5ECF4;
  --hero-a:#0F2F52; --hero-b:#0B5566;
  --good:#5CC98C; --good-bg:#16301F; --warn:#F0AE4A; --warn-bg:#352711; --bad:#F07C6F; --bad-bg:#3A1B17; --wait:#93A3B7; --wait-bg:#1F2935;
  --band:rgba(92,201,140,.12); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141C; --surface:#151E29; --sunk:#1B2633; --ink:#E5ECF4; --muted:#93A3B7; --line:#283545;
  --accent:#123B60; --accent-2:#0E6A7A; --accent-ink:#EAF2FB; --accent-soft:#1C2F45;
  --intime:#8DB8E6; --f3:#4FD18A; --f4:#6EA2FF; --f5:#FF9A55; --f6:#F5C33B; --out:#B78BFF; --tot:#E5ECF4;
  --hero-a:#0F2F52; --hero-b:#0B5566;
  --good:#5CC98C; --good-bg:#16301F; --warn:#F0AE4A; --warn-bg:#352711; --bad:#F07C6F; --bad-bg:#3A1B17; --wait:#93A3B7; --wait-bg:#1F2935;
  --band:rgba(92,201,140,.12); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
h1,h2,h3{font-family:var(--font-head);text-wrap:balance;margin:0}
.num,td.n,th.n{font-family:var(--font-num);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--f4);outline-offset:2px}

/* header */
header.top{background:var(--accent);color:var(--accent-ink);position:relative}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--f3) 0 25%,var(--f4) 25% 50%,var(--f5) 50% 75%,var(--f6) 75% 100%)}
header.top .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;padding-block:18px 14px}
.brand small{display:block;opacity:.78;font-size:12.5px;letter-spacing:.02em}
.brand h1{font-size:21px;font-weight:700;letter-spacing:.01em}
.period{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.period label{font-size:12px;opacity:.8}
.period select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:8px;padding:6px 10px;color:var(--accent-ink)}
.period select option{color:#132033;background:#fff}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 12px;cursor:pointer;color:var(--accent-ink);opacity:.8}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.2);opacity:1;font-weight:600}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:11px 14px;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
:root[data-theme="dark"] nav.tabs a[aria-current="page"]{border-bottom-color:var(--f4)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs a[aria-current="page"]{border-bottom-color:var(--f4)}}
main .wrap{padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}

/* blocks */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:16px;font-weight:600;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:16px}
.row>*{flex:1 1 260px;min-width:0}
.status{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;color:var(--muted);font-size:13px}
.status b{color:var(--ink);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.good{color:var(--good);background:var(--good-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--good) 25%,transparent)} .chip.warn{color:var(--warn);background:var(--warn-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 25%,transparent)}
.chip.bad{color:var(--bad);background:var(--bad-bg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--bad) 25%,transparent)} .chip.wait{color:var(--wait);background:var(--wait-bg)}

.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:820px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;border-top:4px solid var(--c,var(--accent))}
.kpi .lbl{font-size:13px;color:var(--muted);font-weight:500}
.kpi .big{font-family:var(--font-num);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .big small{font-size:16px;color:var(--muted)}
.kpi .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.kpi .meta span b{color:var(--ink);font-family:var(--font-num);font-weight:500}

.floors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.floors{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.floors{grid-template-columns:1fr}}
.fl{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.fl .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fl .name{font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:3px;background:var(--c);display:inline-block;flex:none}
.fl .v{font-family:var(--font-num);font-size:24px;font-variant-numeric:tabular-nums}
.fl .m{font-size:12px;color:var(--muted)}
.gauge{position:relative;height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.gauge .band{position:absolute;top:0;bottom:0;background:var(--band);border-left:1px dashed var(--good);border-right:1px dashed var(--good)}
.gauge .bar{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--c)}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--sunk);font-weight:600;font-size:12.5px;vertical-align:bottom}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
tr.em td{font-weight:600;background:var(--accent-soft)}
th .dot{margin-right:6px}
td.lbl{color:var(--ink);font-weight:500}
td.dim,span.dim{color:var(--muted)}
.col-sum{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.heat td.n{font-weight:500}

h2.sec{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.03em;margin:4px 0 -8px}
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .lbl{font-size:12.5px;color:var(--muted);font-weight:500}
.tile .v{font-family:var(--font-num);font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .v small{font-size:12px;color:var(--muted);font-family:var(--font-ui)}
details summary{cursor:pointer;font-size:12px;color:var(--f4)} details p{font-size:12px;color:var(--muted);margin:6px 0 0}
.h3{font-size:14px;font-weight:600;margin:16px 0 8px}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:13px}
.banner{background:var(--warn-bg);color:var(--ink);font-size:12.5px;text-align:center;padding:6px 16px;border-bottom:1px solid var(--line)}
/* overview: one headline, five equal group cards */
.hero{border-radius:16px;padding:24px 26px;display:flex;flex-wrap:wrap;gap:18px 32px;align-items:center;justify-content:space-between;background:linear-gradient(120deg,var(--hero-a),var(--hero-b));color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;right:-80px;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%)}
.hero>*{position:relative}
.hero-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.hero-k{font-size:13.5px;opacity:.85}
.hero-v{font-family:var(--font-num);font-size:64px;line-height:1;font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:-.01em}
.hero-v small{font-size:22px;opacity:.75}
.hero-s{display:flex;gap:10px;align-items:center;font-size:12.5px;opacity:.95}
.hero-f{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13.5px;opacity:.9;margin-top:6px}
.hero-f b{font-family:var(--font-num);font-weight:500}
.hero-side{display:flex;flex-direction:column;align-items:center;gap:6px}
.hero-cap{font-size:11.5px;opacity:.7}
.hero .chip{background:#fff}
.hero .chip.good{color:#15803D}.hero .chip.bad{color:#C0262D}.hero .chip.warn{color:#B45309}.hero .chip.wait{color:#475569}
.dial text{fill:#fff;font-family:var(--font-num)} .dial .lab{fill:rgba(255,255,255,.7);font-family:var(--font-ui);font-size:10px}
.say{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sc,var(--accent));border-radius:10px;padding:10px 14px}
.say{margin:0;color:var(--ink);font-size:14px;line-height:1.6}
.gcards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.gcards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:560px){.gcards{grid-template-columns:repeat(2,minmax(0,1fr))}.gcard:last-child{grid-column:span 2}.hero-v{font-size:44px}.hero-side{align-items:flex-start}}
.gcard{background:linear-gradient(180deg,color-mix(in srgb,var(--c) 13%,var(--surface)),var(--surface) 70%);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;border-top:5px solid var(--c);min-width:0;transition:transform .15s ease,box-shadow .15s ease}
.gcard:hover{transform:translateY(-2px);box-shadow:0 8px 22px color-mix(in srgb,var(--c) 22%,transparent)}
@media (prefers-reduced-motion:reduce){.gcard{transition:none}.gcard:hover{transform:none}}
.gcard .gauge{height:10px;background:color-mix(in srgb,var(--c) 12%,var(--sunk))}
.gh{font-weight:600;display:flex;align-items:center;gap:6px;font-size:13.5px}
.gh .dot{background:var(--c);width:12px;height:12px;border-radius:4px}
.gv{font-family:var(--font-num);font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums;font-weight:500}
.gv small{font-size:14px;color:var(--muted)}
.gcard .chip{align-self:flex-start}
.gm{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.status.foot{border-top:1px solid var(--line);padding-top:12px}
.tsep{width:1px;background:var(--line);margin:8px 6px;flex:none}
/* sign-in + user box */
.who{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.95;flex-wrap:wrap}
.btn.small{padding:4px 10px;font-size:12px;background:transparent;color:var(--accent-ink);border-color:rgba(255,255,255,.4)}
.gate{max-width:520px;margin:40px auto;display:flex;flex-direction:column;gap:12px;align-items:center}
/* forms & buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input.cell{width:92px;text-align:right;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--font-num)}
input.cell.dirty{border-color:var(--warn);background:var(--warn-bg)}
input.txt,input[type=date]{padding:6px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--sunk);cursor:pointer}
.drop.over{border-color:var(--f4);background:var(--accent-soft)}
.drop strong{font-size:15px}
.note{font-size:12.5px;color:var(--muted)}
.callout{border-radius:8px;padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.callout.warn{background:var(--warn-bg);color:var(--ink)} .callout.good{background:var(--good-bg)} .callout.bad{background:var(--bad-bg)}
.callout.info{background:var(--accent-soft)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--c)}
svg text{fill:var(--muted);font-family:var(--font-ui);font-size:11px}
.rules li{margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;z-index:20}
@media (prefers-reduced-motion:no-preference){.gauge .bar{transition:width .4s ease}}
</style>

<style>:root{color-scheme:light}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>

<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <small>กลุ่มงานการพยาบาลวิสัญญี · โรงพยาบาลมหาสารคาม</small>
      <h1>Productivity วิสัญญี ชั้น 3–6</h1>
    </div>
    <div class="period" aria-label="ช่วงข้อมูล">
      <label for="selFy">ปีงบ</label><select id="selFy"></select>
      <label for="selMonth">เดือน</label><select id="selMonth"></select>
      <div class="seg" role="group" aria-label="โหมด">
        <button id="modeMonth" aria-pressed="true">รายเดือน</button>
        <button id="modeYtd" aria-pressed="false">สะสม YTD</button>
      </div>
      <div class="who" id="who" hidden></div>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="เมนู"><div class="wrap" id="tabs">
  <a href="#overview">ภาพรวม</a><a href="#detail">รายละเอียด</a><a href="#annual">รายปี</a><a href="#asa">ASA</a>
  <a href="#staffing">กำลังคน</a><a href="#report">รายงานตรวจสอบ</a><span class="tsep" aria-hidden="true"></span><a href="#upload">นำเข้าข้อมูล</a><a href="#hours">Nursing Hours</a><a href="#holidays">วันหยุด</a><a href="#rules">กติกา</a><a href="#members" id="tabMembers" hidden>ผู้ใช้งาน</a>
</div></nav>
<main><div class="wrap" id="view"><div class="panel empty">กำลังโหลดข้อมูลกลุ่มงาน…</div></div></main>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
/* Productivity / ASA / FTE engine — กลุ่มงานวิสัญญี (ปีงบ 2570)
   v3.1: Workload FTE = WW ÷ 140 · ห้องนอก OR → ชั้น 4 · ASA ว่าง → ASA 1 (ในเวลา) / 1E (นอกเวลา) · เวรดึกถึง 08:29 = วันก่อน · เลขแถวต้นทาง · Coverage */
const Engine = (() => {
  const WEIGHTS = [0, 2.58, 4.75, 7.08, 9.25];
  const PREOP = 30, IN_FROM = 8 * 60 + 30, IN_TO = 16 * 60 + 30, FTE_MONTH = 140, FTE_YEAR = 1680;
  const FLOORS = ['F3', 'F4', 'F5', 'F6'];
  const GROUPS = ['F3', 'F4', 'F5', 'F6', 'INTIME', 'OUT', 'TOTAL'];
  const ASA = ['ASA 1', 'ASA 2', 'ASA 3', 'ASA 4', 'ASA 5', 'ASA 6', 'ASA 1E', 'ASA 2E', 'ASA 3E', 'ASA 4E', 'ASA 5E', 'ASA 6E'];
  const MISSING = 'Missing ASA', OTHER_ASA = 'ASA รูปแบบอื่น';
  const MONTHS = ['ต.ค.', 'พ.ย.', 'ธ.ค.', 'ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.'];
  const MONTHS_FULL = ['ตุลาคม', 'พฤศจิกายน', 'ธันวาคม', 'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน'];
  const NEED = ['room_name', 'date1', 'time1', 'ane_tm', 'month', 'year', 'asa', 'pacu_tm'];

  function fixThai(s) {
    if (typeof s !== 'string') return s;
    if (/[฀-๿]/.test(s) || !/[¡-û]/.test(s)) return s;
    let o = '';

  let d = ''; pts.forEach((v, i) => { if (v != null) d += (d ? 'L' : 'M') + xs(i).toFixed(1) + ',' + ys(v).toFixed(1); });
  const dots = pts.map((v, i) => v == null ? '' : `<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="${i + 1 === p.to ? 4 : 2.5}" fill="${i + 1 === p.to ? 'var(--accent-ink)' : 'rgba(255,255,255,.6)'}"><title>${E.MONTHS[i]} ${fmt(v)}%</title></circle>`).join('');
  const spark = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="แนวโน้ม Productivity รวมรายเดือน">
    <rect x="0" y="${ys(S.config.high)}" width="${W}" height="${ys(S.config.low) - ys(S.config.high)}" fill="rgba(255,255,255,.14)"/>
    ${d ? `<path d="${d}" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2"/>` : ''}${dots}</svg>`;
  const card = (k) => { const m = M[k], [c, txt] = state(m.prod), w = m.prod == null ? 0 : Math.min(m.prod, 200) / 2;

      <div class="gv">${m.prod == null ? 'N/A' : fmt(m.prod, 1)}<small>${m.prod == null ? '' : ' %'}</small></div>
      <div class="gauge"><div class="band" style="left:${S.config.low/2}%;width:${(S.config.high-S.config.low)/2}%"></div><div class="bar" style="width:${w}%"></div></div>
      <span class="chip ${c}">${txt}</span>
      <div class="gm"><span>${fmt0(m.cases)} ราย</span><span>FTE ${m.gap == null ? 'N/A' : (m.gap < 0 ? 'ขาด ' + fmt(-m.gap, 1) : 'เหลือ ' + fmt(m.gap, 1))}</span></div></a>`; };
  const nhNeed = p.months - filled;
  const R0 = 70, CX = 90, CY = 86, ang = (v) => Math.PI * (1 - Math.min(Math.max(v, 0), 200) / 200);
  const pt = (v, r) => [CX + r * Math.cos(ang(v)), CY - r * Math.sin(ang(v))];
  const arc = (a, b, r) => { const [x1, y1] = pt(a, r), [x2, y2] = pt(b, r); return `M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)}`; };

    <path d="${arc(0, 200, R0)}" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="14" stroke-linecap="round"/>
    <path d="${arc(S.config.low, S.config.high, R0)}" fill="none" stroke="rgba(52,211,153,.55)" stroke-width="14"/>
    ${T.prod != null ? `<path d="${arc(0, T.prod, R0)}" fill="none" stroke="${sc}" stroke-width="6" stroke-linecap="round"/>
    <circle cx="${pt(T.prod, R0)[0].toFixed(1)}" cy="${pt(T.prod, R0)[1].toFixed(1)}" r="7" fill="${sc}" stroke="#fff" stroke-width="2.5"/>` : ''}
    <text class="lab" x="${CX - R0}" y="102" text-anchor="middle">0</text><text class="lab" x="${CX}" y="-2" text-anchor="middle">100%</text><text class="lab" x="${CX + R0}" y="102" text-anchor="middle">200</text>
    <text class="lab" x="${CX}" y="80" text-anchor="middle">เกณฑ์ ${S.config.low}–${S.config.high}</text></svg>`;
  return `
  <section class="hero hero-${tc}">
    <div class="hero-main">
      <div class="hero-k">Productivity รวมทั้งกลุ่มงาน · ${esc(periodText(p))}</div>
      <div class="hero-v">${T.prod == null ? 'N/A' : fmt(T.prod)}<small>${T.prod == null ? '' : ' %'}</small></div>

        <span>Workload FTE <b>${T.gap == null ? 'N/A' : (T.gap < 0 ? 'ขาด ' + fmt(-T.gap, 1) : 'เหลือ ' + fmt(T.gap, 1))}</b></span></div>
    </div>

  <div class="status foot">

    <a href="#detail">ดูตาราง Level · FTE · กระทบยอด →</a>
  </div>`;
}

  <h2 class="sec">ตัวชี้วัดหลัก · รวมทั้งหมด (กด “ดูสูตร” เพื่อดูวิธีคิด)</h2>${strip}

    <div class="tw"><table><thead><tr><th>รายการ</th>${hd}</tr></thead><tbody>
      ${line('จำนวนเคส', (m) => fmt0(m.cases))}

function annual(){
  const fy = S.fy; const rows = []; let maxP = 200;
  for (let i = 1; i <= 12; i++){
    const m = compute(fy, i, i).M, y = compute(fy, 1, i).M;
    rows.push({i, m, y}); ['INTIME','OUT','TOTAL'].forEach((k) => { if (m[k].prod) maxP = Math.max(maxP, Math.ceil(m[k].prod/50)*50); });
  }
  const yr = compute(fy, 1, 12);
  const annualReq = yr.a.G.TOTAL.ww/1680, annualAct = E.nhFor('TOTAL', yr.nh)/1680;
  // chart
  const W = 720, H = 250, L = 44, R = 12, T = 14, B = 30, iw = W-L-R, ih = H-T-B;
  const x = (i) => L + (i-0.5) * iw/12, y = (v) => T + ih - v/maxP*ih;
  const ticks = []; for (let v = 0; v <= maxP; v += 50) ticks.push(v);
  const path = (k) => { let d = '', pts = ''; rows.forEach((r) => { const v = r.m[k].prod; if (v == null) return; d += (d?'L':'M') + x(r.i).toFixed(1) + ',' + y(v).toFixed(1); pts += `<circle cx="${x(r.i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="${COLOR[k]}"><title>${LABEL[k]} ${E.MONTHS[r.i-1]} ${fmt(v)}%</title></circle>`; });
    const c = COLOR[k]; return d ? `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" ${k==='TOTAL'?'stroke-dasharray="5 4"':''}/>${pts}` : ''; };
  const chart = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Productivity รายเดือน">
    <rect x="${L}" y="${y(S.config.high)}" width="${iw}" height="${y(S.config.low)-y(S.config.high)}" fill="var(--band)"/>
    ${ticks.map((v) => `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`).join('')}
    ${E.MONTHS.map((m,i) => `<text x="${x(i+1)}" y="${H-10}" text-anchor="middle">${m}</text>`).join('')}
    ${path('INTIME')}${path('OUT')}${path('TOTAL')}</svg>`;
  const legend = `<div class="legend"><span><i class="sw" style="--c:var(--intime)"></i>รวมในเวลา</span><span><i class="sw" style="--c:var(--out)"></i>นอกเวลา</span><span><i class="sw" style="--c:var(--tot)"></i>รวมทั้งหมด (เส้นประ)</span><span><i class="sw" style="--c:var(--good);height:8px;opacity:.35"></i>เกณฑ์ ${S.config.low}–${S.config.high}%</span></div>`;
  const pc = (v) => { if (v == null) return '<td class="n dim">—</td>'; const [c] = state(v); return `<td class="n" style="color:var(--${c})">${fmt(v)}</td>`; };

function asa(){
  const p = period(); const opts = {asaRaw: S.asaRaw}; const {a} = compute(p.fy, p.from, p.to, opts);
  const cols = ['F3','F4','F5','F6','INTIME','OUT','TOTAL'];
  const cell = (k, v) => `<td class="n ${['INTIME','TOTAL'].includes(k)?'col-sum':''}">${v}</td>`;
  const row = (s, cls='') => `<tr class="${cls}"><td class="lbl">${s}</td>${cols.map((k) => cell(k, fmt0(a.G[k].asa[s]||0))).join('')}</tr>`;
  const assessed = (g) => E.ASA.reduce((s,x) => s + (g.asa[x]||0), 0);
  const hi = (g) => ['ASA 3','ASA 4','ASA 5','ASA 6','ASA 3E','ASA 4E','ASA 5E','ASA 6E'].reduce((s,x) => s + (g.asa[x]||0), 0);
  const em = (g) => E.ASA.filter((x) => x.endsWith('E')).reduce((s,x) => s + (g.asa[x]||0), 0);
  const pct = (n, d) => d ? fmt(n/d*100,1)+'%' : 'N/A';
  return `<section class="panel"><h2>ASA Classification · ${esc(periodText(p))}</h2>
  <p class="sub">ฐานเดียวกับ Productivity · ในเวลา/นอกเวลา มาจากเวลาเริ่มเคส ส่วนตัว E ของ ASA หมายถึง Emergency ตามการประเมินทางคลินิก ไม่เกี่ยวกับนอกเวลา</p>
  <div class="actions" style="margin-bottom:12px"><label class="toggle"><input type="checkbox" id="asaRaw" ${S.asaRaw?'checked':''}> แสดงตามต้นฉบับ (ASA ว่าง = Missing ASA)</label><span class="note">ค่าเริ่มต้น: ASA ว่าง ในเวลา = ASA 1 · นอกเวลา = ASA 1E ตามกติกากลุ่มงาน</span></div>
  ${S.asaRaw ? '' : '<div class="callout info" style="margin-bottom:12px">ASA ว่างถูกใส่ค่าตามกติกากลุ่มงาน (ในเวลา = ASA 1 · นอกเวลา = ASA 1E) เพื่อการสรุปภาระงาน · ติ๊กด้านบนเพื่อดูตามต้นฉบับ</div>'}
  <div class="tw"><table><thead><tr><th>ASA</th>${cols.map((k) => `<th class="n ${['INTIME','TOTAL'].includes(k)?'col-sum':''}"><span class="dot" style="--c:${COLOR[k]}"></span>${LABEL[k]}</th>`).join('')}</tr></thead>
  <tbody>${E.ASA.map((x) => row(x)).join('')}
  <tr class="em"><td>${S.asaRaw?'ASA ที่ประเมินจริง':'รวม ASA 1–6E'}</td>${cols.map((k) => cell(k, fmt0(assessed(a.G[k])))).join('')}</tr>
  ${row(E.MISSING)}${row(E.OTHER_ASA)}
  <tr class="em"><td>รวมเคส</td>${cols.map((k) => cell(k, fmt0(a.G[k].cases))).join('')}</tr>
  <tr><td class="lbl">ASA 3 ขึ้นไป (รวม 3E–6E)</td>${cols.map((k) => cell(k, fmt0(hi(a.G[k])))).join('')}</tr>
  <tr><td class="lbl">% ASA 3 ขึ้นไป</td>${cols.map((k) => cell(k, pct(hi(a.G[k]), assessed(a.G[k])))).join('')}</tr>
  <tr><td class="lbl">% Emergency (E)</td>${cols.map((k) => cell(k, pct(em(a.G[k]), assessed(a.G[k])))).join('')}</tr>
  </tbody></table></div></section>`;
}

function staffCfg(){
  const d = S.config.staffing || {};

}
async function saveStaffing(){
  const o = {}; let bad = false;
  STAFF_KEYS.forEach((k) => { o[k] = {}; STAFF_FIELDS.forEach(([f]) => { const v = $(`#st-${k}-${f}`).value.trim(); if (v === '') return; const n = Number(v); if (!isFinite(n) || n < 0) bad = true; else o[k][f] = n; }); });
  if (bad){ toast('กรอกเป็นตัวเลข 0 ขึ้นไป'); return; }
  await saveConfig({staffing:o}, 'ตั้งค่ากำลังคนตามแผน');
}

async function readFile(file){
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false, codepage:874});
    let parsed = null;
    for (const n of wb.SheetNames){
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:null});
      const p = E.parseSheet(aoa); if (!p.error){ parsed = p; break; } parsed = parsed || p;
    }
    if (parsed.error){ S.pending = {error: parsed.error + ' — ตรวจว่าเป็นไฟล์สถิติดมยาจากระบบ'}; render(); return; }
    const byMonth = {};
    parsed.rows.forEach((r) => { const f = E.fiscalOf(r); if (f){ const k = keyOf(f.fy,f.fidx); byMonth[k] = (byMonth[k]||0) + 1; } });
    const main = Object.entries(byMonth).sort((a,b) => b[1]-a[1])[0];
    if (!main){ S.pending = {error:'อ่านเดือน/ปีของข้อมูลไม่ได้ (คอลัมน์ month, year)'}; render(); return; }
    const [key] = main;
    S.pending = {fileName: file.name, rows: parsed.rows, byMonth, key, fy: +key.slice(0,4), fidx: +key.slice(5)};
    S.fy = S.pending.fy; S.fidx = S.pending.fidx;
    render();
  } catch (e){ S.pending = {error:'เปิดไฟล์ไม่ได้: ' + (e.message || e)}; render(); }
}
async function saveUpload(){
  const p = S.pending; if (!p || !S.db) return;
  const btn = $('#saveUp'); btn.disabled = true; btn.textContent = 'กำลังบันทึก…';
  try {
    const CH = 700, parts = Math.ceil(p.rows.length / CH);
    const old = S.uploads[p.key];
    for (let i = 0; i < parts; i++) await S.db.doc(`rows/${p.key}-p${i}`).set({key:p.key, part:i, rows:JSON.stringify(p.rows.slice(i*CH, (i+1)*CH))});
    if (old) for (let i = parts; i < (old.parts||0); i++) await S.db.doc(`rows/${p.key}-p${i}`).delete();
    await S.db.doc(`uploads/${p.key}`).set({key:p.key, fy:p.fy, fidx:p.fidx, fileName:p.fileName, rowCount:p.rows.length, parts, byMonth:p.byMonth, uploadedAt:new Date().toISOString(), uploadedBy:S.myId});
    await log(old ? 'แทนที่ไฟล์' : 'นำเข้าไฟล์', `${monthLabel(p.fy,p.fidx)} · ${p.fileName} · ${p.rows.length} แถว`);
    S.pending = null; toast('บันทึกแล้ว ระบบคำนวณใหม่ให้ทุกหน้า'); location.hash = '#overview';
  } catch (e){ btn.disabled = false; btn.textContent = 'ลองบันทึกอีกครั้ง'; toast(e.code === 'quota_exceeded' ? 'พื้นที่ฐานข้อมูลเต็ม' : 'บันทึกไม่สำเร็จ: ' + (e.message||e.code)); }
}
async function deleteUpload(key){
  const u = S.uploads[key]; if (!u) return;
  try { for (let i = 0; i < (u.parts||1); i++) await S.db.doc(`rows/${key}-p${i}`).delete();
    await S.db.doc(`uploads/${key}`).delete(); await log('ลบไฟล์', `${monthLabel(u.fy,u.fidx)} · ${u.fileName}`); S.confirmDel = null; toast('ลบแล้ว'); }
  catch (e){ toast('ลบไม่สำเร็จ'); }
}

async function downloadCsv(){

  const cols = ['F3','F4','F5','F6','INTIME','OUT','TOTAL'];
  const rows = [['รายการ', ...cols.map((k) => LABEL[k])],
    ['จำนวนเคส', ...cols.map((k) => M[k].cases)], ['Weighted Workload', ...cols.map((k) => M[k].ww.toFixed(2))],
    ['Nursing Hours', ...cols.map((k) => M[k].nh)], ['Productivity %', ...cols.map((k) => M[k].prod==null?'':M[k].prod.toFixed(2))],
    ['Workload Hours', ...cols.map((k) => M[k].wh.toFixed(2))], ['Workload Required FTE', ...cols.map((k) => M[k].req.toFixed(2))],
    ['Actual FTE', ...cols.map((k) => M[k].act==null?'':M[k].act.toFixed(2))], ['FTE Gap', ...cols.map((k) => M[k].gap==null?'':M[k].gap.toFixed(2))]];
  const csv = '﻿' + `ช่วงข้อมูล,${periodText(p)}\n` + rows.map((r) => r.map((c) => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));

}

      <button class="btn primary">เพิ่มผู้ใช้</button></form>
    <div class="tw"><table><thead><tr><th>อีเมล</th><th>สิทธิ์</th><th>เพิ่มเมื่อ</th><th></th></tr></thead><tbody>
    ${list.map(([em, m]) => `<tr><td class="lbl">${esc(em)}${em === S.myId ? ' <span class="chip good">คุณ</span>' : ''}</td>
      <td><select class="txt" data-role="${esc(em)}" ${em === S.myId ? 'disabled' : ''}>${['viewer','editor','admin'].map((r) => `<option value="${r}" ${m.role===r?'selected':''}>${roleTh[r]}</option>`).join('')}</select></td>
      <td class="dim">${m.addedAt ? new Date(m.addedAt).toLocaleDateString('th-TH') : '—'}</td>
      <td>${em === S.myId ? '' : (S.confirmMem === em ? `<span class="actions"><button class="btn danger" data-delmem="${esc(em)}">ยืนยันลบ</button><button class="btn" data-nodelmem>ไม่ลบ</button></span>` : `<button class="btn danger" data-askmem="${esc(em)}">ลบ</button>`)}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}
function bindMembers(){
  const f = $('#memForm'); if (!f) return;
  f.onsubmit = async (e) => { e.preventDefault(); const em = $('#mEmail').value.trim().toLowerCase(), role = $('#mRole').value;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast('อีเมลไม่ถูกต้อง'); return; }
    try { await S.db.doc('members/' + em).set({role, addedAt: new Date().toISOString(), addedBy: S.myId}); await log('เพิ่มผู้ใช้', `${em} · ${role}`); $('#mEmail').value = ''; toast('เพิ่มผู้ใช้แล้ว'); } catch (err){ toast('เพิ่มไม่สำเร็จ: ' + (err.code || err.message)); } };
  document.querySelectorAll('[data-role]').forEach((sel) => sel.onchange = async () => { const em = sel.dataset.role;
    try { await S.db.doc('members/' + em).set({...S.members[em], role: sel.value}); await log('เปลี่ยนสิทธิ์', `${em} → ${sel.value}`); toast('บันทึกแล้ว'); } catch { toast('บันทึกไม่สำเร็จ'); } });
  document.querySelectorAll('[data-askmem]').forEach((b) => b.onclick = () => { S.confirmMem = b.dataset.askmem; render(); });
  document.querySelectorAll('[data-nodelmem]').forEach((b) => b.onclick = () => { S.confirmMem = null; render(); });
  document.querySelectorAll('[data-delmem]').forEach((b) => b.onclick = async () => { const em = b.dataset.delmem;
    try { await S.db.doc('members/' + em).delete(); await log('ลบผู้ใช้', em); S.confirmMem = null; toast('ลบแล้ว'); } catch { toast('ลบไม่สำเร็จ'); } });
}

/* ---------- sign-in gate ---------- */
function gateHtml(kind, email){
  if (kind === 'setup') return `<div class="panel empty gate"><h2>ยังไม่ได้ตั้งค่า Firebase</h2><p class="note">เปิดไฟล์ <b>firebase-config.js</b> ใน GitHub แล้ววางค่า firebaseConfig จาก Firebase Console ตามคู่มือขั้นที่ 3</p></div>`;
  if (kind === 'login') return `<div class="panel empty gate"><h2>เข้าสู่ระบบ</h2><p class="note">ใช้บัญชี Google ที่ผู้ดูแลระบบเพิ่มสิทธิ์ให้แล้ว</p><button class="btn primary" id="btnLogin">เข้าสู่ระบบด้วย Google</button></div>`;
  if (kind === 'denied') return `<div class="panel empty gate"><h2>บัญชีนี้ยังไม่มีสิทธิ์</h2><p class="note">ส่งอีเมลนี้ให้ผู้ดูแลระบบเพิ่มสิทธิ์ที่เมนู “ผู้ใช้งาน”</p><p><b class="num">${esc(email)}</b></p><button class="btn" id="btnLogout2">ออกจากระบบ / เปลี่ยนบัญชี</button></div>`;
  return `<div class="panel empty gate"><h2>เชื่อมต่อไม่ได้</h2><p class="note">${esc(email || '')}</p></div>`;
}
function bindGate(){
  const b = $('#btnLogin'); if (b) b.onclick = async () => { const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
    try { await firebase.auth().signInWithPopup(p); } catch (e){ if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') firebase.auth().signInWithRedirect(p); else if (e.code !== 'auth/popup-closed-by-user') toast('เข้าสู่ระบบไม่สำเร็จ: ' + e.code); } };
  const o = $('#btnLogout2'); if (o) o.onclick = () => firebase.auth().signOut();
}
function showGate(kind, email){ S.gate = gateHtml(kind, email); $('#who').hidden = kind !== 'denied'; render(); }

/* ---------- boot (Firebase) ---------- */
let unsubs = [];
function stopSubs(){ unsubs.forEach((u) => u()); unsubs = []; }
function startSubs(db){
  S.loaded = {uploads:false, rows:false, nh:false, config:false}; S.periodSet = false;
  const timer = setTimeout(() => { S.stale = true; render(); }, 10000);
  const done = (k) => () => { S.loaded[k] = true; if (Object.values(S.loaded).every(Boolean)){ clearTimeout(timer); S.stale = false; } };
  const err = (k) => (e) => { console.error(k, e); S.loaded[k] = true; if (e && e.code === 'permission-denied') toast('ไม่มีสิทธิ์อ่านข้อมูล'); render(); };
  unsubs.push(db.collection('uploads').onSnapshot((s) => { S.uploads = {}; s.docs.forEach((d) => S.uploads[d.id] = d.data()); done('uploads')(); render(); }, err('uploads')));
  unsubs.push(db.collection('rows').onSnapshot((s) => { S.rowsDocs = {}; s.docs.forEach((d) => S.rowsDocs[d.id] = d.data()); rebuildRows(); done('rows')(); render(); }, err('rows')));
  unsubs.push(db.collection('nh').onSnapshot((s) => { S.nh = {}; s.docs.forEach((d) => S.nh[d.id] = d.data()); done('nh')(); render(); }, err('nh')));
  unsubs.push(db.doc('settings/config').onSnapshot((d) => { if (d.exists) S.config = {...S.config, ...d.data()}; done('config')(); render(); }, err('config')));
  unsubs.push(db.collection('audit').orderBy('at','desc').limit(30).onSnapshot((s) => { S.audit = s.docs.map((d) => d.data()); resolveNames(); render(); }, () => {}));
  if (S.isAdmin) unsubs.push(db.collection('members').onSnapshot((s) => { S.members = {}; s.docs.forEach((d) => S.members[d.id] = d.data()); if (viewName() === 'members') render(); }, () => {}));
}
const _bind = bind;
bind = function(v){ _bind(v); if (v === 'members') bindMembers(); };
S.members = {};
render();
(() => {
  const cfg = window.firebaseConfig;
  if (!window.firebase || !cfg || !cfg.apiKey || String(cfg.apiKey).includes('วาง')){ showGate('setup'); return; }
  firebase.initializeApp(cfg);
  const db = firebase.firestore();
  firebase.auth().getRedirectResult().catch(() => {});
  firebase.auth().onAuthStateChanged(async (u) => {
    stopSubs(); S.db = null; S.canEdit = false; S.isAdmin = false;
    if (!u){ $('#who').hidden = true; $('#tabMembers').hidden = true; showGate('login'); return; }
    const email = (u.email || '').toLowerCase(); S.myId = email;
    $('#who').innerHTML = `<span>${esc(email)}</span><button class="btn small" id="btnLogout">ออกจากระบบ</button>`; $('#who').hidden = false;
    $('#btnLogout').onclick = () => firebase.auth().signOut();
    let role = null;
    try { const m = await db.doc('members/' + email).get(); role = m.exists ? m.data().role : null; } catch (e){ role = null; }
    if (!role){ showGate('denied', email); return; }
    S.role = role; S.canEdit = role === 'admin' || role === 'editor'; S.isAdmin = role === 'admin';
    $('#tabMembers').hidden = !S.isAdmin;
    $('#who').innerHTML = `<span>${esc(email)} · ${{admin:'ผู้ดูแลระบบ', editor:'ผู้แก้ไข', viewer:'ผู้ดู'}[role]}</span><button class="btn small" id="btnLogout">ออกจากระบบ</button>`;
    $('#btnLogout').onclick = () => firebase.auth().signOut();
    S.gate = null; S.db = db; startSubs(db); render();
  });
})();
})();
</script>
